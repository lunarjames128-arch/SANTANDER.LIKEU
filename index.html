<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abriendo sitio oficial...</title>
    <style>
        body {
            background-color: #0b132b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .card {
            background-color: #1c2541;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        .btn {
            background-color: #00b4d8;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #0096c7;
        }
    </style>
    <script>
        // TU LINK DE AFILIADO ACTUALIZADO
        var urlFinal = "https://track.leadsmatcher.com/paVmRh"; 

        function redirigir() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isAndroid = /Android/i.test(ua);
            
            if (isAndroid) {
                var intentUrl = "intent://#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(urlFinal) + ";end";
                window.location.href = intentUrl;
            } else {
                window.location.href = urlFinal;
            }
        }
        
        window.onload = function() {
            setTimeout(redirigir, 500);
        };
    </script>
</head>
<body>
    <div class="card">
        <h2>Cargando sitio seguro...</h2>
        <p>Si la página no carga automáticamente en tu navegador, presiona el botón de abajo:</p>
        <a href="#" onclick="redirigir(); return false;" class="btn">Presionar aquí para continuar</a>
    </div>
</body>
</html>
